plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.chen.carlistener'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.chen.carlistener"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 签名文件：carlistener.jks | 别名：vistaup | 密码：vistaup123456 | 有效期：99999天
    signingConfigs {
        vistaup {
            storeFile file('../carlistener.jks')
            storePassword 'vistaup123456'
            keyAlias 'vistaup'
            keyPassword 'vistaup123456'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.vistaup
        }
        release {
            signingConfig signingConfigs.vistaup
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation files('libs/tinypinyin-2.0.3.jar')
}